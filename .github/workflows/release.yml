name: Swift

on:
  release:
    branches: [ dev ]
    types: [ published ]

jobs:
  test-package:
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v7
    - name: sw_vers
      run: sw_vers
    - name: Available Xcodes
      run: ls /Applications | grep Xcode
    - name: Switch to Xcode 27
      run: sudo xcode-select -s "/Applications/Xcode_27.0.app/Contents/Developer"
    - name: Xcode Version
      run: xcodebuild -version
    - name: Test LodeRunner package
      run: swift test -v -Xswiftc -warnings-as-errors

  build-app:
    runs-on: xcode-27

    strategy:
      fail-fast: false
      matrix:
        destination:
          - 'generic/platform=iOS Simulator'
          - 'platform=macOS'
          - 'generic/platform=tvOS Simulator'

    steps:
    - uses: actions/checkout@v7
    - name: Switch to Xcode 27
      run: sudo xcode-select -s "/Applications/Xcode_27.0.app/Contents/Developer"
    - name: Install iOS
      run: xcodebuild -downloadPlatform iOS
    - name: Install tvOS
      run: xcodebuild -downloadPlatform tvOS
    - name: Show Destinations
      run: xcodebuild -scheme LodeRunnerApp -showdestinations
    - name: Build LodeRunnerApp
      run: xcodebuild -verbose -skipPackagePluginValidation -scheme LodeRunnerApp -destination '${{ matrix.destination }}' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""
