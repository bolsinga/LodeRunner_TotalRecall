name: Swift

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7
    - name: sw_vers
      run: sw_vers
    - name: Available Xcodes
      run: ls /Applications | grep Xcode
    - name: Switch to Xcode 26
      run: sudo xcode-select -s "/Applications/Xcode_26.5.app/Contents/Developer"
    - name: Xcode Version
      run: xcodebuild -version
    - name: Install iOS
      run: xcodebuild -downloadPlatform iOS
    - name: Show SDKs
      run: xcodebuild -showsdks
    - name: Show Destinations
      run: xcodebuild -scheme LodeRunnerApp -showdestinations
    - name: Test LodeRunner package
      run: swift test -v -Xswiftc -warnings-as-errors
    - name: Build LodeRunnerApp (iOS / macOS)
      run: xcodebuild -verbose -skipPackagePluginValidation -scheme LodeRunnerApp -destination "generic/platform=iOS Simulator" -destination "generic/platform=macOS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""
